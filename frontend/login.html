<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="/css/style.css"><title>Login</title></head>
<body>
<main>
  <form id="login-form">
    <h1>Login</h1>
    <label for="email">Email</label>
    <input id="email" type="email" placeholder="Digite seu email" required>
    <label for="senha">Senha</label>
    <input id="senha" type="password" placeholder="Digite sua senha" required>
    <button class="button button-primary">Entrar</button>
    <a href="/cadastro.html">Criar conta</a>
  </form>
</main>
<script src="/js/api.js"></script><script src="/js/auth.js"></script>
</body></html>
