<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="/css/style.css"><title>Cadastro</title></head>
<body>
<main>
  <form id="register-form">
    <h1>Cadastro</h1>
    <label for="nome">Nome</label>
    <input id="nome" type="text" placeholder="Digite seu nome" required>
    <label for="email">Email</label>
    <input id="email" type="email" placeholder="Digite seu email" required>
    <label for="senha">Senha</label>
    <input id="senha" type="password" placeholder="Crie uma senha" required>
    <label for="tipo">Tipo de conta</label>
    <select id="tipo"><option value="cliente">Cliente</option><option value="tecnico">Tecnico</option></select>
    <button class="button button-primary">Criar conta</button>
  </form>
</main>
<script src="/js/api.js"></script><script src="/js/auth.js"></script>
</body></html>
