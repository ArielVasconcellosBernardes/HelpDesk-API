<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="/css/style.css"><title>Dashboard</title></head>
<body>
<header><nav><span id="userName"></span><button id="logout-button" class="button button-secondary">Sair</button></nav></header>
<main class="grid">
  <section class="card">
    <h2>Criar chamado</h2>
    <form id="chamado-form">
      <label for="titulo">Titulo</label>
      <input id="titulo" placeholder="Digite o titulo do chamado" required>
      <label for="descricao">Descricao</label>
      <textarea id="descricao" placeholder="Descreva o problema" required></textarea>
      <label for="prioridade">Prioridade</label>
      <select id="prioridade"><option>Baixa</option><option selected>Média</option><option>Alta</option><option>Urgente</option></select>
      <button>Abrir chamado</button>
    </form>
  </section>
  <section class="card">
    <h2>Chamados</h2>
    <table><thead><tr><th>Titulo</th><th>Status</th><th>Prioridade</th><th>Data</th><th>Tecnico</th></tr></thead><tbody id="listaChamados"></tbody></table>
  </section>
</main>
<script src="/js/api.js"></script><script src="/js/app.js"></script><script src="/js/chamados.js"></script>
</body></html>
